name: Python CI

"on":
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Syntax check (all tracked Python files)
        run: |
          python - <<'PY'
          import py_compile
          import subprocess
          import sys

          files = subprocess.check_output(["git", "ls-files", "*.py"], text=True).splitlines()
          failures = []

          for path in files:
              try:
                  py_compile.compile(path, doraise=True)
              except Exception as exc:
                  failures.append((path, str(exc)))

          if failures:
              print("\nSyntax check failed for:")
              for path, err in failures:
                  print(f"- {path}: {err}")
              sys.exit(1)

          print(f"Syntax check passed for {len(files)} Python files.")
          PY

      - name: Dependency import health check
        run: |
          python - <<'PY'
          import importlib

          modules = [
              "numpy",
              "pandas",
              "scipy",
              "sklearn",
              "joblib",
              "mne",
              "plotly",
              "streamlit",
              "PIL",
          ]

          for name in modules:
              importlib.import_module(name)
              print(f"OK: {name}")
          PY
